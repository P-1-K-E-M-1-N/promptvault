<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptVault</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="brand" href="#/search" aria-label="PromptVault home">
        <img src="icon.svg" alt="" width="22" height="22"><span>PromptVault</span>
      </a>
      <nav class="tabs" aria-label="Views">
        <a href="#/search" data-tab="search">Search</a>
        <a href="#/library" data-tab="library">Prompt Library <span id="star-count" class="count"></span></a>
        <a href="#/import" data-tab="import">Import</a>
        <a href="#/about" data-tab="about">Privacy</a>
      </nav>
    </div>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search every prompt, reply, and fix…" aria-label="Search">
      <label class="mine" title="Only search what you typed (shortcut: Alt+P)">
        <input id="mine" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span class="mine-label">My prompts only</span>
      </label>
    </form>
    <div id="filters" class="filters">
      <select id="f-source" aria-label="Source"><option value="">All sources</option></select>
      <select id="f-project" aria-label="Project"><option value="">All projects</option></select>
      <label class="date">From <input id="f-from" type="date"></label>
      <label class="date">To <input id="f-to" type="date"></label>
      <select id="f-sort" aria-label="Sort">
        <option value="relevance">Best match</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
      <label class="check"><input id="f-tools" type="checkbox"> Include tool calls &amp; output</label>
    </div>
    <div id="status" class="status" hidden></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="drop" class="drop" hidden><div>Drop a ChatGPT, Claude, or Gemini export to import it</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="foot">
    <span>Runs on your machine. Nothing uploaded.</span>
    <span>Made by <a href="https://github.com/YOUR_GITHUB_USERNAME" target="_blank" rel="noopener noreferrer">YOUR_NAME</a> · <a href="https://github.com/sponsors/YOUR_GITHUB_USERNAME" target="_blank" rel="noopener noreferrer">Sponsor</a></span>
  </footer>
  <script src="app.js" type="module"></script>
</body>
</html>
