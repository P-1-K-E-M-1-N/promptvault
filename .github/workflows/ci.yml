name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '23', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node -e "const s=require('node:sqlite');new s.DatabaseSync(':memory:').exec('create virtual table t using fts5(x)');console.log('FTS5 OK on', process.version)"
        continue-on-error: true
      - run: npm test
      - run: node bin/promptvault.js index --db ./.ci/index.db --claude-dir ./test/fixtures/claude-code
